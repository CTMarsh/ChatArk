name: ChatArk
# Generated by XcodeGen — https://github.com/yonaskolb/XcodeGen
options:
  bundleIdPrefix: com.chrismarsh
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"

schemes:
  ChatArk:
    build:
      targets:
        ChatArk: all
        ShareExtension: all
        NotificationServiceExtension: all
        ChatWidgets: all
        ChatArkWatch: all
        ChatArkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ChatArkTests
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: WTPX4TSW4N
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  ChatArk:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - ChatArk
      - ChatArk/Shared
    settings:
      base:
        PRODUCT_NAME: ChatArk
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ChatArk/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ChatArk
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.social-networking"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification fetch"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ChatArk/ChatArk.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    dependencies:
      - package: Supabase
      - package: Nuke
        product: NukeUI
      - package: KeychainAccess
      - target: ShareExtension
        platformFilter: ios
      - target: NotificationServiceExtension
        platformFilter: ios
      - target: ChatWidgets
        platformFilter: ios
      - target: ChatArkWatch

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: KeychainAccess

  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - NotificationServiceExtension
    info:
      path: NotificationServiceExtension/Info.plist
      properties:
        CFBundleDisplayName: Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationServiceHandler"
    settings:
      base:
        PRODUCT_NAME: NotificationServiceExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark.notification-service
        CODE_SIGN_ENTITLEMENTS: NotificationServiceExtension/NotificationServiceExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  ChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ChatWidgets
    info:
      path: ChatWidgets/Info.plist
      properties:
        CFBundleDisplayName: ChatArk Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: ChatWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark.ChatWidgets
        CODE_SIGN_ENTITLEMENTS: ChatWidgets/ChatWidgets.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  ChatArkWatch:
    type: application
    platform: watchOS
    sources:
      - ChatArkWatch
      - ChatArk/Shared/Models
      - ChatArk/Shared/ViewModels
      - ChatArk/Shared/Services
      - ChatArk/Shared/Utilities
      - ChatArk/Shared/PreviewData.swift
      - ChatArk/Shared/SharedViews/AvatarView.swift
      - ChatArk/Shared/SharedViews/StatusIndicator.swift
      - ChatArk/Shared/SharedViews/TypingIndicator.swift
    settings:
      base:
        PRODUCT_NAME: ChatArk Watch
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark.watchos
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_INDEPENDENT_WATCH_APP: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chrismarsh.chatark
        INFOPLIST_KEY_CFBundleDisplayName: ChatArk
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        CODE_SIGN_ENTITLEMENTS: ChatArkWatch/ChatArkWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    dependencies:
      - package: Supabase
      - package: KeychainAccess
      - package: Nuke
        product: NukeUI

  # -- unit tests -----------------------------------------------------------
  # ChatArk's first test target. It deliberately compiles the pure source files it
  # exercises straight into the bundle rather than doing `@testable import ChatArk`.
  # Reason: `@testable import` drags the whole app module -- and therefore Supabase,
  # NukeUI and KeychainAccess -- into the test bundle's module graph, which is a large
  # surface for a first-ever test run to fail on for reasons that have nothing to do
  # with the tests. Everything listed below is Foundation-only, so the bundle resolves
  # with no package dependencies at all. The files are the shipped sources, not copies,
  # so a change to production code is picked up here.
  #
  # If XcodeGen rejects `supportedDestinations` on a unit-test bundle in the pinned
  # version, the one-line fallback is `platform: iOS`.
  ChatArkTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - ChatArkTests
      - ChatArk/Shared/Utilities/PostgRESTSanitizer.swift
      - ChatArk/Shared/Utilities/DeepLinkRoute.swift
      - ChatArk/Shared/Utilities/SignupGate.swift
      - ChatArk/Shared/Utilities/AppGroupKeyMaterial.swift
    dependencies:
      # Host app. Keeps the test run honest: the app itself has to build before a
      # single assertion runs.
      - target: ChatArk
    settings:
      base:
        PRODUCT_NAME: ChatArkTests
        PRODUCT_BUNDLE_IDENTIFIER: com.chrismarsh.chatark.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
